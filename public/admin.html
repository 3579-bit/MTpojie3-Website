<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MT網站後台</title><style>*{box-sizing:border-box}body{margin:0;background:#060808;color:#f4f0e7;font-family:Arial,"Microsoft JhengHei",sans-serif}a{color:inherit;text-decoration:none}.w{width:min(1080px,calc(100% - 32px));margin:auto}.btn{display:inline-block;padding:12px 18px;border:1px solid #b48a38;border-radius:10px;background:#1b1810;font-weight:800}.gold{color:#d8b667}.muted{color:#929792}nav{height:72px;border-bottom:1px solid #3c321d;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 1080px)/2))}.hero{min-height:680px;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#252116,#0b0d0c 45%,#060808 70%)}h1{font-size:clamp(54px,8vw,100px);margin:15px}.lead{font-size:28px;font-weight:900}.copy{max-width:700px;margin:20px auto;line-height:1.8}.pills,.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.pill{border:1px solid #43391f;border-radius:999px;padding:9px 14px;font-weight:800}section{padding:90px 0;border-top:1px solid #ffffff0b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:24px;border:1px solid #40371f;border-radius:16px;background:#0c1010}.card p{color:#929792}.demo{margin-top:25px;aspect-ratio:16/7;border:1px solid #40371f;border-radius:20px;display:grid;place-items:center}.road{padding:14px;border-bottom:1px solid #ffffff10}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style><style>.panel{padding:24px;border:1px solid #40371f;border-radius:16px;background:#0c1010;margin:18px 0}label{display:block;color:#d8b667;font-size:12px;font-weight:bold;margin:15px 0 6px}input,textarea{width:100%;padding:13px;border:1px solid #343833;border-radius:9px;background:#070909;color:white;font:inherit}textarea{min-height:110px}.hide{display:none}.msg{color:#69dfbd;margin-top:12px}</style></head><body><div class="w" style="padding-top:35px"><h2>MT破解屍 3.0｜網站後台</h2>
<div id="login" class="panel"><h3>管理員登入</h3><label>後台密碼</label><input id="pw" type="password"><button class="btn" style="margin-top:14px;color:white" onclick="go()">登入</button><div id="lm" class="msg"></div></div>
<div id="edit" class="hide"><div class="panel"><h3>網址</h3><label>破解屍系統</label><input id="systemUrl"><label>LINE</label><input id="lineUrl"><label>Threads</label><input id="threadsUrl"><label>Demo 影片</label><input id="demoUrl"></div><div class="panel"><h3>首頁文字與圖片</h3><label>品牌名稱</label><input id="brandName"><label>正式 LOGO 圖片網址（選填）</label><input id="logoUrl"><label>首頁系統截圖網址（選填；留空顯示介面示意）</label><input id="heroImageUrl"><label>主標題</label><input id="heroTitle"><label>副標題</label><input id="heroLead"><label>介紹</label><textarea id="heroCopy"></textarea></div><div class="panel"><h3>Roadmap（一行一個）</h3><textarea id="roadmap"></textarea></div><button class="btn" style="color:white" onclick="save()">儲存並更新官網</button> <a href="/" class="btn">查看官網</a><div id="sm" class="msg"></div></div></div>
<script>let t=localStorage.mtadm||"";async function go(){let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw.value})}),j=await r.json();if(!r.ok){lm.textContent=j.error;return}t=j.token;localStorage.mtadm=t;load()}async function load(){let r=await fetch("/api/admin/config",{headers:{Authorization:"Bearer "+t}});if(!r.ok)return;let c=await r.json();login.classList.add("hide");edit.classList.remove("hide");["systemUrl","lineUrl","threadsUrl","demoUrl","heroTitle","heroLead","heroCopy","brandName","heroImageUrl","logoUrl"].forEach(k=>document.getElementById(k).value=c[k]||"");roadmap.value=(c.roadmap||[]).join("\n")}async function save(){let b={};["systemUrl","lineUrl","threadsUrl","demoUrl","heroTitle","heroLead","heroCopy","brandName","heroImageUrl","logoUrl"].forEach(k=>b[k]=document.getElementById(k).value.trim());b.roadmap=roadmap.value.split("\n").map(x=>x.trim()).filter(Boolean);let r=await fetch("/api/admin/config",{method:"PUT",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:JSON.stringify(b)});sm.textContent=r.ok?"已更新，重新整理前台即可看到。":"更新失敗"}if(t)load()</script></body></html>
